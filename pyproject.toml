[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reminder-agent"
version = "0.1.0"
description = "Safety-focused natural-language reminder proposal agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.21,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
